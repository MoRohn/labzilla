apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: lif-services, namespace: ai-system, labels: {app.kubernetes.io/part-of: lif}}
spec:
  selector:
    matchLabels: {app.kubernetes.io/part-of: lif}
    matchExpressions: [{key: lif.dev/metrics, operator: NotIn, values: ["false"]}]   # services without /metrics
  endpoints: [{port: http, path: /metrics, interval: 30s}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: lif-model-servers, namespace: ai-serving}
spec:
  selector: {matchLabels: {lif.dev/role: model-server}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: lif-alerts, namespace: ai-system}
spec:
  groups:
    - name: lif
      rules:
        - alert: LIFUsefulAIUnavailable
          expr: max(lif_available{capability="useful_local_ai"}) == 0
          for: 5m
          labels: {severity: critical}
          annotations: {summary: "No local text model is answering inference probes (fast and default both down)."}
        - alert: LIFGatewayDown
          expr: max(lif_available{capability="gateway"}) == 0
          for: 3m
          labels: {severity: critical}
          annotations: {summary: "LIF gateway health probe failing."}
        - alert: LIFDefaultDegraded
          expr: max(lif_available{capability="default_model"}) == 0 and max(lif_available{capability="fast_model"}) == 1
          for: 30m
          labels: {severity: warning}
          annotations: {summary: "local/default is being served by a fallback for 30m."}
        - alert: LIFJevCircuitOpen
          expr: max(lif_jev_circuit_open) == 1
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Jev circuit breaker open; decisions are running on rules/local fallback."}
        - alert: LIFHostHeadroomLow
          expr: max(gpusched_mem_available_mib) < 8192
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Host MemAvailable below gpusched's 8 GiB headroom — check LIF CPU tiers (anon memory)."}
        # Live lookups (docs/WEB_GROUNDING.md). SearXNG has no /metrics; its health is how lookups fare.
        - alert: LIFWebSearchFailing
          expr: |
            sum(increase(lif_web_lookups_total{status="error"}[15m])) >= 3
            and sum(increase(lif_web_lookups_total{status="error"}[15m]))
              > 0.5 * sum(increase(lif_web_lookups_total{status=~"ok|empty|error"}[15m]))
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Most live web lookups are failing (SearXNG or its engines). Answers say they couldn't confirm recent facts. Check kubectl -n ai-system logs deploy/searxng."}
    # ── Chat speed (docs/GPU_SCHEDULING.md → The cgroup-fit lesson) ──
    - name: lif-serving
      rules:
        - alert: LIFModelServerThrashing
          # tier0 at a too-small limit: median ~1,700 major faults/s (2026-10-01); healthy ≈ 0
          expr: sum by (pod) (rate(container_memory_failures_total{namespace="ai-serving",container="llama",failure_type="pgmajfault",scope="container"}[5m])) > 100
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "{{ $labels.pod }} is re-reading model weights from disk ({{ $value | humanize }} major faults/s). Its memory limit is below weights + anon, or the host is reclaiming its page cache."}
        - alert: LIFDecodeSlow
          expr: |
            (sum by (pod) (increase(llamacpp:tokens_predicted_total[30m])) > 200)
            and (sum by (pod) (increase(llamacpp:tokens_predicted_total[30m]))
                 / sum by (pod) (increase(llamacpp:tokens_predicted_seconds_total[30m]))) < 8
          for: 15m
          labels: {severity: warning}
          annotations: {summary: "{{ $labels.pod }} is generating below 8 tok/s (healthy 4B: ~20). Check LIFModelServerThrashing and host MemAvailable."}
        - alert: LIFFirstTokenSlow
          expr: histogram_quantile(0.9, sum by (le, profile) (rate(lif_ttft_seconds_bucket[30m]))) > 10
          for: 30m
          labels: {severity: warning}
          annotations: {summary: "p90 time to first token for {{ $labels.profile }} is {{ $value | humanizeDuration }} (queueing or slow prompt processing)."}
    # ── Decision Engineering (docs/DECISION_ENGINEERING.md) ──
    - name: lif-decision-engineering
      rules:
        - record: lif:decision_offload_rate:1h
          expr: >-
            sum(rate(lif_cascade_resolutions_total{tier=~"jev|code"}[1h]))
            / sum(rate(lif_cascade_resolutions_total{tier!="baseline"}[1h]))
        - record: lif:frontier_generation_avoidance_rate:1h
          expr: >-
            1 - sum(rate(lif_cascade_resolutions_total{tier=~"kimi|frontier"}[1h]))
            / sum(rate(lif_cascade_resolutions_total{tier!="baseline"}[1h]))
        - record: lif:decision_safe_default_rate:1h
          expr: >-
            sum by (decision) (rate(lif_cascade_resolutions_total{tier="safe_default"}[1h]))
            / sum by (decision) (rate(lif_cascade_resolutions_total[1h]))
        - alert: LIFEscalationProviderCircuitOpen
          expr: max by (provider) (lif_provider_circuit_open) == 1
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Escalation provider {{ $labels.provider }} breaker open; middle-zone decisions fall to the next tier or the safe default."}
        - alert: LIFDecisionSafeDefaultsHigh
          expr: lif:decision_safe_default_rate:1h > 0.25 and on(decision) sum by (decision) (rate(lif_cascade_resolutions_total[1h])) > 0.01
          for: 30m
          labels: {severity: warning}
          annotations: {summary: "{{ $labels.decision }}: over 25% of decisions end on the safe default (no tier could resolve them)."}
        - alert: LIFHumanReviewBacklog
          expr: max(lif_human_review_queue) > 50
          for: 1h
          labels: {severity: info}
          annotations: {summary: "More than 50 decisions are waiting for human review (Control Center → Decision Engineering → Review Queue)."}
        - alert: LIFDecisionOutcomeErrors
          expr: >-
            sum by (decision) (increase(lif_decision_outcomes_total{route="auto",outcome="incorrect"}[24h]))
            / sum by (decision) (increase(lif_decision_outcomes_total{route="auto"}[24h])) > 0.1
            and on(decision) sum by (decision) (increase(lif_decision_outcomes_total{route="auto"}[24h])) >= 20
          labels: {severity: warning}
          annotations: {summary: "{{ $labels.decision }}: over 10% of automatic decisions with known outcomes were wrong in 24 h; consider `local-ai decision rollback`."}
    # ── SQLite backups of the local-path lif-decisions PVC (15-backup.yaml) ──
    - name: lif-backup
      rules:
        - alert: LIFSQLiteBackupStale
          expr: >-
            (time() - max(kube_cronjob_status_last_successful_time{namespace="ai-system",cronjob="lif-sqlite-backup"}) > 2 * 86400)
            or (absent(kube_cronjob_status_last_successful_time{namespace="ai-system",cronjob="lif-sqlite-backup"})
                and on() max(kube_cronjob_info{namespace="ai-system",cronjob="lif-sqlite-backup"}) == 1)
          for: 30h
          labels: {severity: warning}
          annotations: {summary: "No successful lif-sqlite-backup run in 2 days: decisions.db / decision-eng.db are not backed up."}
        - alert: LIFSQLiteBackupFailed
          expr: max(kube_job_status_failed{namespace="ai-system",job_name=~"lif-sqlite-backup-.*"}) > 0
          for: 15m
          labels: {severity: warning}
          annotations: {summary: "A lif-sqlite-backup Job failed: `kubectl -n ai-system logs job/<name>`."}
