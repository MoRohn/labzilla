# Local Intelligence Fabric — platform policy.
# Every service loads this file (mounted from the lif-config ConfigMap). Values here are
# admission and routing INPUTS; the GPU itself is arbitrated by the host's gpusched.

availability_target: 0.95

# ── Host GPU scheduler (gpusched) ─────────────────────────────────────────
# The single GPU admission authority on this box. The LIF only READS it (metrics
# token) for the primary-workload capacity signal. GPU tiers lease through its K8s gate.
gpusched:
  url: http://10.42.0.1:8770
  token_file: /var/run/lif/gpusched/token
  poll_sec: 5
  stale_after_sec: 30           # older than this → treat primary-workload state as IMMINENT (fail-safe)

# Primary-workload predictive capacity state, from gpusched's validated forecast.
blerbz:
  state_thresholds:             # P(production arrival within the next hour)
    moderate: 0.20
    high: 0.50
  # IMMINENT = a production lease is live, a resident is reloading, or gpusched is unreachable.

# ── Tier 0 bandwidth yield ────────────────────────────────────────────────────
# GB10 decode is memory-bandwidth bound (~273 GB/s shared by CPU and GPU). Production
# LLM decode already uses ~235 GB/s, so CPU inference slows the primary workload. While the primary workload is
# IMMINENT (production running) the CPU tiers throttle to this many concurrent requests.
yield:
  cpu_concurrency_normal: 4
  cpu_concurrency_blerbz: 1
  max_tokens_blerbz: 512        # clamp long generations while production runs

# ── Host memory guard ─────────────────────────────────────────────────────────
# The LIF's CPU tiers share the 128 GB pool with the primary workload's resident models. gpusched keeps an
# 8 GiB MemAvailable headroom for its own admissions; the LIF gives memory back BEFORE
# that line is crossed, whatever the cause (the primary workload, desktop apps, the LIF itself).
memory_guard:
  sustain_sec: 60
  large_aliases: [local/web]               # shed first: its head model's server (12+ GiB; gateway → local/default)
  shed_large_below_mib: 10240              # restored above this + the server's memory limit + 1 GiB
  optional: [tier0-small]                  # shed first (redundancy tiers)
  shed_optional_below_mib: 9216
  restore_optional_above_mib: 13056       # ≥ shed line + tier0-small's 3840 Mi limit, or a restore re-sheds
  secondary: [embedding]                   # shed only in the danger zone
  shed_secondary_below_mib: 6144
  restore_secondary_above_mib: 8704
  # tier0 (the hot fallback) is never shed by the guard; the kernel OOM score and its
  # 4.75 GiB cgroup limit bound it instead.

gpu:
  safety_reserve_gb: 16

# ── Decision Fabric ───────────────────────────────────────────────────────────
decision_fabric:
  provider: typesafe_jev        # typesafe_jev | rules  (rules = Jev disabled)
  jev:
    base_url: https://api.typesafe.ai
    model: jev-1.13.0           # pinned; jev-latest is never used in production
    timeout_sec: 4
    max_concurrency: 16
    circuit_breaker: {failures: 5, reset_sec: 60}
    price_usd_per_mtok_input: 0.42
  confidence:                   # defaults; each decision definition may override
    auto: 0.97
    validate: 0.85
    escalate: 0.70
  cache:
    enabled: true
    ttl_sec: 86400
    max_entries: 50000

# ── Decision Engineering (docs/DECISION_ENGINEERING.md) ────────────────────────
# Every number below is a POLICY input. Production thresholds are not here: they are
# chosen per decision from calibration and pinned by a release (lif/decision/registry.py).
decision_engineering:
  state_compiler_version: sc-1
  # Tolerated rate of WRONG automatic decisions (95% upper bound) by consequence.
  # critical has no entry: it is never automated (human / hard policy only).
  max_error_by_risk: {low: 0.05, medium: 0.02, high: 0.005}
  calibration:
    min_samples: 200
    min_auto: 30
    required_slices: [common, edge]
    min_per_slice: 20
    min_low_confidence: 20
    min_high_confidence: 50
    min_failures: 5
    low_band: 0.8
    high_band: 0.9
  promotion:
    min_tests: 20
    min_test_accuracy: 0.9
    max_regression: 0.01            # accuracy drop vs the previous version that still passes CI
    max_coverage_drop: 0.05
  cascade:
    # Default escalation order for the MIDDLE zone. Local first: Kimi is optional
    # infrastructure, never the foundation of local availability (spec §78).
    middle_route: [local_reasoning, kimi]
    defaults: {accept: 0.7, code_min: 0.99, min_margin: 0.0}
  shadow:
    sample_pct: 100                 # share of eligible requests that also run shadow candidates
  traces:
    claude_code_dirs: [~/.claude/projects]
    # Never mined by default: primary-workload sessions (spec: primary-workload integration
    # internals are private). Pass --source explicitly to override, and keep results in private/.
    exclude: ["*-home-tiny-bnn*"]
    retention_days: 90
  heavy_executors: [kimi-k3, frontier, local-reasoning, claude, gpt, opus, sonnet]
  # Estimates used ONLY until shadow telemetry exists for a decision (then measured values win).
  jev_state_tokens_estimate: 400
  jev_latency_ms_estimate: 300
  cycle: {enabled: true, interval_sec: 21600, initial_delay_sec: 300}
  # Real agents in shadow (POST /de/observe). The agent's own answer always serves.
  observe:
    discovery: true             # lif/models/discovery.py → model-advance
    # auto: every observed case is labelled by lif/decision/autolabel.py (the decision's criteria in code,
    # scored against its designed tests); no human review queue. human: the old queue (below).
    review: auto
    review_agreement_pct: 20    # review: human only — share of AGREEMENTS also sent to review (all disagreements are)

# ── Privacy ───────────────────────────────────────────────────────────────────
privacy:
  default_class: CONFIDENTIAL   # unlabelled application data never leaves the box
  jev_allowed: [PUBLIC]         # add INTERNAL here to allow internal data to Jev
  external_llm_allowed: []      # no cloud LLM fallback is configured
  confidential_external_allowed: false
  # Live web lookups (docs/WEB_GROUNDING.md). Owner decision 2026-10-03: allowed under "Local only", because
  # only the built search query (≤ 200 chars, never the conversation) leaves the box, and the receipt shows
  # it. A query the detectors above flag (keys, emails, phone numbers) is never sent. RESTRICTED prompts
  # are never looked up.
  web_search_allowed: [PUBLIC, INTERNAL, CONFIDENTIAL]

# ── Models ────────────────────────────────────────────────────────────────────
models:
  automatic_discovery: false
  automatic_download: false
  automatic_promotion: true      # benchmark-approved models go through a measured canary (lif/controller/autopromote.py)
  rollback_versions: 2
  store_path: /models
  discovery:
    max_listed_per_category: 200
    detail_fetch_per_category: 40
    shortlist_per_category: 5
    min_downloads: 1000
    allowed_licenses: [apache-2.0, mit, bsd-3-clause, llama3.1, llama3.2, llama3.3, gemma, qwen]
    blocked_orgs: []
  promotion:
    max_quality_regression: 0.01
    max_latency_regression_pct: 10
    max_memory_increase_pct: 20
    structured_output_min: 0.98
    min_quality_no_incumbent: 0.5   # absolute floor when the alias is empty (e.g. the first vision model)
    crash_rate_max: 0
    canary_percent: 10
    # Live canary gates (autopromote.py), compared with the incumbent over the canary's own window:
    canary_min_hours: 24            # a full day of traffic patterns before any verdict
    canary_min_requests: 100        # …and enough answers for the percentiles to mean something
    canary_max_hours: 72            # no verdict by then (too little traffic) → canary ends as inconclusive
    canary_max_error_rate: 0.01     # failed upstream calls / requests
    # local/web (evaluator.compare_web): grounded quality on evals/web.yaml decides, against what answers
    # grounded questions today (local/web's head, else local/default's), with an absolute latency ceiling.
    web:
      min_quality: 0.85             # share of web-suite items passed
      min_gain: 0.05                # over the baseline's web-suite score (when the baseline was measured)
      max_latency_ms_p50: 15000     # end to end per answer, reasoning included
      crash_rate_max: 0

batch:
  enabled: true
  max_attempts: 3
  default_timeout_sec: 600

# ── Cost model (ESTIMATES — see docs/COST_MODEL.md) ─────────────────────────────
cost:
  # What the same tokens would cost on a comparable hosted small-model API.
  external_equivalent_usd_per_mtok: {input: 0.15, output: 0.60}
  # Local marginal cost: GB10 system power delta × electricity price.
  electricity_usd_per_kwh: 0.16
  cpu_tier_incremental_watts: 25

gateway:
  request_timeout_sec: 300
  max_body_bytes: 4194304
  rate_limit_rpm: 600

# ── Live information (lif/web, docs/WEB_GROUNDING.md) ─────────────────────────────
web:
  enabled: true
  searxng_url: http://searxng.ai-system.svc:8080
  default_for_auto: true          # local/auto looks things up when needs-live-data says so; other aliases opt in
  default_timezone: UTC           # callers send X-LIF-Timezone (the console sends the browser's)
  default_location: ""            # for "what's the weather?" with no place named, e.g. "Springfield, Illinois" (set per host)
  model_knowledge_year: 2025      # a year at or after this in a question means "needs live data"
  alias: local/web                # grounded answers; falls back to local/default while local/web is empty
  deadline_sec: 4.0               # all lookups for one question, page reads included
  read_pages: 3                   # pages read when the search snippets don't hold the answer
  read_timeout_sec: 2.0
  max_results: 6
  max_evidence_chars: 2400        # ~600 prompt tokens: ~4 s of prompt reading for the 4B on the CPU
  rewrite_timeout_sec: 3.0        # follow-up → standalone query by local/instant
  disclaimer_guard: true          # a "my knowledge has a cutoff" opening is replaced by a grounded answer
  disclaimer_window_chars: 220

# ── Labzilla Console (docs/CONSOLE.md) ────────────────────────────────────────
console:
  public_url: https://labzilla.local          # pairing QR codes use this: phones resolve .local via mDNS
  alt_urls: [https://labzilla.tiny-dgx.lan]   # needs LAN DNS or /etc/hosts
  mdns: published                 # homelab/host/systemd/labzilla-mdns.service (user unit, no sudo)
  session_ttl_days: 30            # signed-in browser
  device_session_ttl_days: 90     # paired phone/tablet (revocable under Connect → Devices)
  pairing_ttl_sec: 120            # single-use QR token lifetime
  poll_sec: 5                     # one upstream poll per cycle, fanned out to every viewer over SSE
  default_mode: auto              # Ask mode for new threads (auto|fast|balanced|deep|code|vision)
