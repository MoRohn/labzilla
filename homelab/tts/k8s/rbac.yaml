# The API creates, lists and deletes its GPU worker Jobs. Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata: {name: tts-api}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tts-api}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tts-api}
subjects: [{kind: ServiceAccount, name: tts-api}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tts-api}
