# GPU worker, created by the API (never applied directly). gpusched gate/hold pattern from
# ~/bnn/deploy/k8s/gpusched. One lease per run: the worker exits when idle (300 s) or after
# 840 s, inside the declared est_sec, and the API starts a fresh Job if work remains.
# backoffLimit 0: gpusched deletes a preempted pod, and a Job retry would re-queue at once.
# GPUSCHED_MEM_MB: measured 3396 MiB (nvidia-smi) / 3172 MiB reserved, n=1, 2026-10-12, plus margin.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: tts-gpu-worker-
  labels: {app.kubernetes.io/name: tts-gpu-worker}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 12600          # gate wait (≤ 3 h) + one run
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: tts-gpu-worker, gpusched.bnn/gated: "true"}
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: gpusched-token, secret: {secretName: gpusched-token, defaultMode: 0444}}
        - {name: gpusched-scripts, configMap: {name: gpusched-gate, defaultMode: 0555}}
        - {name: gpusched-lease, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: models, persistentVolumeClaim: {claimName: tts-models, readOnly: true}}
        - name: auth
          secret: {secretName: tts-auth, defaultMode: 0440, items: [{key: worker_token, path: worker_token}]}
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
      initContainers:
        - name: gpusched-gate
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/scripts/gate.sh"]
          env: &gpusched_env
            - {name: GPUSCHED_URL, value: "http://10.42.0.1:8770"}
            - {name: GPUSCHED_NAME, value: "tts-gpu-worker"}
            - {name: GPUSCHED_MEM_MB, value: "4096"}
            - {name: GPUSCHED_EST_SEC, value: "900"}
            - {name: GPUSCHED_TIMEOUT_SEC, value: "1200"}
            - {name: GPUSCHED_CLASS, value: "interactive"}
            - {name: GPUSCHED_PREEMPTIBLE, value: "true"}
            - {name: GPUSCHED_MAX_WAIT_SEC, value: "10800"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts: &gpusched_mounts
            - {name: gpusched-token, mountPath: /var/run/gpusched, readOnly: true}
            - {name: gpusched-scripts, mountPath: /scripts, readOnly: true}
            - {name: gpusched-lease, mountPath: /gpusched}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
        - name: gpusched-hold
          image: curlimages/curl:8.10.1
          restartPolicy: Always           # native sidecar: releases the lease when the worker exits
          command: ["/bin/sh", "/scripts/hold.sh"]
          env: *gpusched_env
          volumeMounts: *gpusched_mounts
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
      containers:
        - name: worker
          image: 127.0.0.1:5000/tts/chatterbox:20261012-1433
          command: ["python", "-m", "tts.worker", "--device", "cuda"]
          env:
            - {name: NVIDIA_VISIBLE_DEVICES, value: all}
            - {name: HOME, value: /tmp}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TTS_WORKER_API, value: "http://tts-worker.tts.svc:8081"}
            - {name: TTS_IDLE_SEC, value: "300"}
            - {name: TTS_MAX_RUN_SEC, value: "840"}
            - {name: TTS_THREADS, value: "4"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          volumeMounts:
            - {name: models, mountPath: /models/hf, readOnly: true}
            - {name: auth, mountPath: /var/run/tts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}   # peak RSS 4.9 GiB in the GPU run (n=1)
