# DEPRECATED 2026-10-19: do not apply. See homelab/docs/tts.md.
# Applied by scripts/install-tts.sh once the secrets exist. Managed by Argo CD from git after that.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MoRohn/labzilla.git
    targetRevision: main
    path: homelab/tts/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: tts
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
